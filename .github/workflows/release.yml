name: Release & Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'store/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  release-and-publish:
    name: Bump, Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(jq -r '.version' manifest.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          jq --arg v "$NEW_VERSION" '.version = $v' manifest.json > tmp.json && mv tmp.json manifest.json
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      # The Web Store assigns the item's key; a "key" in the upload is refused.
      # It stays in the repo so unpacked copies keep the ID the helper expects.
      - name: Build store ZIP
        run: ./store/build-zip.sh dist/speakr-recorder-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Speakr Recorder v${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist/speakr-recorder-${{ steps.version.outputs.version }}.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Skipped until every CHROME_* secret is set.
      - name: Upload to Chrome Web Store
        if: env.EXTENSION_ID != '' && env.PUBLISHER_ID != '' && env.CLIENT_ID != '' && env.CLIENT_SECRET != '' && env.REFRESH_TOKEN != ''
        run: npx -y chrome-webstore-upload-cli upload --source dist/speakr-recorder-${{ steps.version.outputs.version }}.zip

      - name: Publish to Chrome Web Store
        if: env.EXTENSION_ID != '' && env.PUBLISHER_ID != '' && env.CLIENT_ID != '' && env.CLIENT_SECRET != '' && env.REFRESH_TOKEN != ''
        run: npx -y chrome-webstore-upload-cli publish
