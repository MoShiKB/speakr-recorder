name: Release & Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'store/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  release-and-publish:
    name: Bump, Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(jq -r '.version' manifest.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          jq --arg v "$NEW_VERSION" '.version = $v' manifest.json > tmp.json && mv tmp.json manifest.json
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      # The Web Store assigns the item's key; a "key" in the upload is refused.
      # It stays in the repo so unpacked copies keep the ID the helper expects.
      - name: Build store ZIP
        run: ./store/build-zip.sh dist/speakr-recorder-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "Speakr Recorder v${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist/speakr-recorder-${{ steps.version.outputs.version }}.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The store refuses a new upload while a version is in review; the next
      # push after approval publishes the latest code anyway.
      - name: Check review state
        id: review
        if: env.EXTENSION_ID != '' && env.PUBLISHER_ID != '' && env.CLIENT_ID != '' && env.CLIENT_SECRET != '' && env.REFRESH_TOKEN != ''
        run: |
          token=$(curl -sf https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          state=$(curl -s -H "Authorization: Bearer $token" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus" \
            | jq -r '.submittedItemRevisionStatus.state // "NONE"')
          echo "Submitted revision: $state"
          if [ "$state" = PENDING_REVIEW ]; then
            echo "::notice::A version is in review; this one is released on GitHub only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Skipped until every CHROME_* secret is set, and while a review is pending.
      - name: Upload to Chrome Web Store
        if: steps.review.outputs.publish == 'true'
        run: npx -y chrome-webstore-upload-cli upload --source dist/speakr-recorder-${{ steps.version.outputs.version }}.zip

      - name: Publish to Chrome Web Store
        if: steps.review.outputs.publish == 'true'
        run: npx -y chrome-webstore-upload-cli publish
