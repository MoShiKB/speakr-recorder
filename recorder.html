<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Speakr Recorder: whole computer</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="recorder" data-state="choosing">
  <main class="card">
    <header>
      <img src="icons/icon48.png" alt="" width="36" height="36">
      <h1>Record whole computer</h1>
    </header>

    <ol id="steps">
      <li>Click your screen under <b>Entire Screen</b></li>
      <li>Keep <b>Share system audio</b> on</li>
      <li>Press <b>Share</b></li>
    </ol>

    <p id="message"></p>

    <div class="rec-live">
      <span class="dot"></span>
      <span id="elapsed">00:00</span>
      <span id="mic" class="muted"></span>
    </div>

    <div class="actions">
      <button id="choose" class="primary">Choose what to share</button>
      <button id="stop" class="danger">Stop</button>
      <button id="cancel">Cancel</button>
    </div>

    <p class="hint">This window minimizes itself while recording. Stop from the
      extension icon, <b>Alt+Shift+R</b>, or Chrome's "Stop sharing" bar.</p>
  </main>

  <script type="module" src="recorder.js"></script>
</body>
</html>
